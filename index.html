<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Click Frenzy! 🎉</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e50027">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NEW: The background layer for the hyperdrive wormhole -->
  <div id="warp-bg" class="warp-bg"></div>

  <main class="game">
    <h1 class="title">Click Frenzy! 🎉</h1>

    <div class="score" id="score">0</div>

    <div class="stats">
      <div class="stat">
        <span id="cps">0</span>
        <small>clicks / sec</small>
      </div>
      <div class="stat">
        <span id="best">0</span>
        <small>best score</small>
      </div>
    </div>

    <button id="clickBtn" class="click-btn" type="button">TAP ME!</button>

    <p class="hint">Tap as fast as you can — but don't stop, or your score melts away! 🫠</p>

    <div class="actions">
      <button id="resetBtn" class="pill-btn reset-btn" type="button">🔄 Reset</button>
      <button id="installBtn" class="pill-btn install-btn" type="button">📲 Install App</button>
    </div>
  </main>

  <script src="script.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => console.log('Service worker registered:', reg.scope))
          .catch((err) => console.log('Service worker failed:', err));
      });
    }
  </script>

</body>
</html>
